{% extends "base.html" %}
{% block title %}Set up TooGather{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Set up TooGather</h1>
  <p class="muted">Create the first account. It becomes the admin, who can add people and projects.</p>
  {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="display_name">Your name</label>
    <input id="display_name" name="display_name" type="text" required value="{{ display_name or '' }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">
    <p class="small muted">At least 10 characters.</p>
    <button type="submit">Create admin account</button>
  </form>
</div>
{% endblock %}
