{% extends "base.html" %}
{% block title %}Sign in | TooGather{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Sign in</h1>
  {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <p></p>
    <button type="submit">Sign in</button>
  </form>
  <p class="small muted">Forgot your password? Ask your TooGather admin to reset your account.</p>
</div>
{% endblock %}
