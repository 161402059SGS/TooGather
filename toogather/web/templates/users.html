{% extends "base.html" %}
{% block title %}People | TooGather{% endblock %}
{% block content %}
<h1>People</h1>
<div class="table-wrap"><table>
  <thead><tr><th>Name</th><th>Email</th><th>Admin</th><th>Created</th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr><td>{{ u.display_name }}</td><td>{{ u.email }}</td><td>{{ 'Yes' if u.is_admin else 'No' }}</td><td>{{ u.created_at.strftime('%Y-%m-%d') }}</td></tr>
  {% endfor %}
  </tbody>
</table></div>

<h2>Add a person</h2>
<form method="post" action="/admin/users" class="narrow">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label for="display_name">Name</label><input id="display_name" name="display_name" type="text" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="password">Temporary password</label><input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">
  <label class="checkbox"><input type="checkbox" name="is_admin"> Admin (can see every project)</label>
  <p></p>
  <button type="submit">Create account</button>
</form>
{% endblock %}
