{% extends "base.html" %}
{% block title %}New project | TooGather{% endblock %}
{% block content %}
<div class="narrow">
  <h1>New project</h1>
  {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/projects/new">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="name">Project name</label>
    <input id="name" name="name" type="text" required placeholder="e.g. Warehouse system rollout">
    <label for="description">Short description (optional)</label>
    <input id="description" name="description" type="text">
    <p class="small muted">AI extraction starts switched off. Turn it on in project settings once you know the client allows it.</p>
    <button type="submit">Create project</button>
  </form>
</div>
{% endblock %}
